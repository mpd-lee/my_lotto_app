<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="utf-8">
    <title>로또픽 - 안전 결제</title>
    <!-- 토스페이먼츠 공식 결제 SDK -->
    <script src="https://js.tosspayments.com/v1/payment"></script>
    <style>
        body {
            margin: 0;
            padding: 40px;
            background-color: #0e1117;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            text-align: center;
        }
        .pay-card {
            background: linear-gradient(145deg, #1f1b13, #2d2618);
            border: 2px solid #facc15;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.4);
            max-width: 500px;
            margin: 40px auto;
        }
        .btn-pay {
            background: linear-gradient(135deg, #059669, #047857);
            color: white;
            border: 2px solid #facc15;
            padding: 16px 24px;
            font-size: 18px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 20px rgba(250, 204, 21, 0.6);
            width: 100%;
        }
        .btn-pay:hover { filter: brightness(1.2); }
        .btn-cancel {
            background: #1e293b;
            color: #f87171;
            border: 2px solid #f87171;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: 900;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 15px;
            width: 100%;
        }
        .btn-cancel:hover { background: #dc2626; color: white; }
    </style>
</head>
<body>
    <div class="pay-card">
        <h2 style="color: #fde047; margin-top: 0;">👑 토스페이먼츠 안전 결제</h2>
        <p style="color: #e2e8f0; font-size: 15px; line-height: 1.6;">
            상품명: <b>VIP 골든픽 1주(7일) 프리패스</b><br>
            결제 금액: <span style="color: #4ade80; font-size: 20px; font-weight: bold;">1,000원</span>
        </p>
        <p style="color: #a7f3d0; font-size: 13px; margin-bottom: 20px;">
            아래 버튼을 누르시면 안전한 토스 결제창이 열립니다.
        </p>
        <button class="btn-pay" onclick="requestTossPayment()">💎 토스 결제창 열기 (1,000원)</button>
        <br>
        <button class="btn-cancel" onclick="location.href='https://mylottoapp-3mygrnqs6j7ard8n3zrvj9.streamlit.app'">❌ 메인으로 돌아가기</button>
    </div>

    <script>
        function requestTossPayment() {
            try {
                var clientKey = "test_ck_kYG57Eba3GblXWjwLeyw8pWDOxmA";
                var tossPayments = TossPayments(clientKey);
                var orderId = "lotto" + Date.now() + Math.floor(Math.random() * 900 + 100);
                
                tossPayments.requestPayment("카드", {
                    amount: 1000,
                    orderId: orderId,
                    orderName: "VIP 골든픽 1주(7일) 프리패스",
                    successUrl: "https://mylottoapp-3mygrnqs6j7ard8n3zrvj9.streamlit.app/?payment_success=true",
                    failUrl: "https://mylottoapp-3mygrnqs6j7ard8n3zrvj9.streamlit.app/?payment_fail=true"
                }).catch(function (error) {
                    if (error.code !== "USER_CANCEL") {
                        alert("결제 오류: " + error.message);
                    }
                });
            } catch(e) {
                alert("결제 초기화 오류: " + e.message);
            }
        }
    </script>
</body>
</html>
